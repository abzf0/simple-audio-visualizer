<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIS-01 / Frequency Analyzer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <audio id="audio"></audio>

  <header class="bar">
    <div class="cell brand">
      <span class="status" aria-hidden="true"></span>
      <h1>VIS-01</h1>
    </div>
    <div class="cell track">
      <span class="tag">TRACK</span>
      <span id="trackName" class="track-name">NONE LOADED</span>
    </div>
    <label class="cell load">
      <span>LOAD FILE</span>
      <input type="file" id="fileInput" accept="audio/*" class="sr" />
    </label>
  </header>

  <main class="layout">
    <section class="main-col">
      <div class="stage">
        <canvas id="canvas"></canvas>
        <p class="no-signal">NO SIGNAL<br /><span>LOAD A TRACK TO BEGIN</span></p>
      </div>

      <div class="transport">
        <button type="button" id="playBtn" class="play" disabled>PLAY</button>
        <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Seek" disabled />
        <span id="time" class="time">00:00 / 00:00</span>
      </div>
    </section>

    <aside class="panel" aria-label="Settings">
      <div class="panel-title">PARAMETERS</div>

      <label class="ctl">
        <span class="ctl-head"><span>SENSITIVITY</span><output id="sensitivityValue">1.0</output></span>
        <input type="range" id="sensitivity" min="0.5" max="3" step="0.1" value="1" />
      </label>

      <label class="ctl">
        <span class="ctl-head"><span>BAR COUNT</span><output id="barCountValue">64</output></span>
        <input type="range" id="barCount" min="8" max="128" step="8" value="64" />
      </label>

      <label class="ctl">
        <span class="ctl-head"><span>SMOOTHING</span><output id="smoothingValue">0.8</output></span>
        <input type="range" id="smoothing" min="0" max="0.95" step="0.05" value="0.8" />
      </label>

      <label class="ctl">
        <span class="ctl-head"><span>PALETTE</span></span>
        <select id="palette">
          <option value="signal">SIGNAL</option>
          <option value="acid">ACID</option>
          <option value="ice">ICE</option>
          <option value="spectrum">SPECTRUM</option>
        </select>
      </label>

      <label class="ctl">
        <span class="ctl-head"><span>MODE</span></span>
        <select id="mode">
          <option value="bars">BARS</option>
        </select>
      </label>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
